# ═══════════════════════════════════════════════════════════════
# MedVisionHub — Nginx Gateway Configuration (Blue-Green)
# ═══════════════════════════════════════════════════════════════
# Upstream block này sẽ được script deploy tự động thay đổi
# giữa medvision-backend-blue và medvision-backend-blue
# ═══════════════════════════════════════════════════════════════

upstream backend_active {
    server medvision-backend-blue:8080;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy REST API requests to active backend
    location /api/ {
        proxy_pass http://backend_active/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy WebSocket requests to active backend
    location /ws/ {
        proxy_pass http://backend_active/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Serve static uploaded medical images via active backend
    location /uploads/ {
        proxy_pass http://backend_active/uploads/;
        proxy_set_header Host $host;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
