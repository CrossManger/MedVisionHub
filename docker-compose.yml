services:
  # ── PostgreSQL Database Container ───────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: medvision-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-${POSTGRES_USER:-postgres}}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-postgres123}}
      POSTGRES_DB: ${DB_NAME:-${POSTGRES_DB:-medvisionhub}}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-${POSTGRES_USER:-postgres}} -d ${DB_NAME:-${POSTGRES_DB:-medvisionhub}}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Golang Backend Container ────────────────────────────────────
  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    container_name: medvision-backend
    restart: always
    environment:
      APP_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-${POSTGRES_USER:-postgres}}
      DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-postgres123}}
      DB_NAME: ${DB_NAME:-${POSTGRES_DB:-medvisionhub}}
      JWT_SECRET: ${JWT_SECRET:-medvision_secret_key_production_local}
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
      UPLOAD_DIR: "./uploads"
    ports:
      - "8082:8080"
    volumes:
      - ./app/backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  # ── React + Nginx Frontend Container ────────────────────────────
  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    container_name: medvision-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
