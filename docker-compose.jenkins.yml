services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: local-jenkins
    user: root
    ports:
      - "8081:8080"
      - "50001:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
    restart: always

volumes:
  jenkins_home:
    driver: local
